name: Create Release

on:
  workflow_dispatch:

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Determine Next Version
        id: next_version
        run: |
          # Fetch all tags
          git fetch --tags

          # Get the latest tag that matches semver (x.y.z)
          LATEST_TAG=$(git tag -l "[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | head -n 1)

          if [ -z "$LATEST_TAG" ]; then
            NEW_TAG="0.1.0"
          else
            # Split version into components
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_TAG"

            # Increment patch version for automatic release
            NEW_PATCH=$((PATCH + 1))
            NEW_TAG="$MAJOR.$MINOR.$NEW_PATCH"
          fi

          # Use commit count as versionCode
          VERSION_CODE=$(git rev-list --count HEAD)

          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Next version: $NEW_TAG (code: $VERSION_CODE)"

      - name: Sync Android Version and Commit
        id: sync_version
        run: |
          VERSION_NAME="${{ steps.next_version.outputs.tag }}"
          VERSION_CODE="${{ steps.next_version.outputs.version_code }}"

          echo "Updating app/build.gradle.kts with versionName=$VERSION_NAME and versionCode=$VERSION_CODE"

          # Update versionCode
          sed -i "s/versionCode = [0-9]*/versionCode = $VERSION_CODE/" app/build.gradle.kts

          # Update versionName
          sed -i "s/versionName = \".*\"/versionName = \"$VERSION_NAME\"/" app/build.gradle.kts

          # Commit and push changes
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "chore: bump version to $VERSION_NAME ($VERSION_CODE) [skip ci]"
          git push origin main

          # Get the new SHA
          NEW_SHA=$(git rev-parse HEAD)
          echo "new_sha=$NEW_SHA" >> $GITHUB_OUTPUT

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleRelease

      - name: Create Draft Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.next_version.outputs.tag }}
          target_commitish: ${{ steps.sync_version.outputs.new_sha }}
          name: Release ${{ steps.next_version.outputs.tag }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
